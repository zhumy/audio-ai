<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">旋转复向量与余弦投影</title>
  <desc id="desc">左侧单位圆上的复向量匀速旋转，虚线始终从箭头端点连到右侧余弦曲线上的当前投影点；旋转一周对应一个余弦周期。</desc>
  <style>
    text {
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #10191b;
      paint-order: stroke fill;
      stroke: #f6f7f2;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .axis { stroke: #607175; stroke-width: 2; }
    .circle { fill: none; stroke: #68a8a5; stroke-width: 3; }
    .vector { stroke: #8f6500; stroke-width: 6; marker-end: url(#arrow); }
    .projection { stroke: #8f6500; stroke-width: 2; stroke-dasharray: 7 5; }
    .wave { fill: none; stroke: #087b78; stroke-width: 5; }
    .arrow-head, .phase-point { fill: #8f6500; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; stroke-width: 2px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f5f1e9; stroke: #071117; }
      .axis { stroke: #7f9291; }
      .circle { stroke: #69eee3; }
      .vector, .projection { stroke: #f4c965; }
      .wave { stroke: #69eee3; }
      .arrow-head, .phase-point { fill: #f4c965; }
    }
  </style>
