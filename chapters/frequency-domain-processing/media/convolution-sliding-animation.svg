<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">离散卷积包含输入、滤波器和输出</title>
  <desc id="desc">上方是输入序列，中间是翻转后滑动的滤波器，底部是卷积输出序列。滤波器每移动一格，重叠样本相乘并累加得到一个输出点。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #10191b; }
    .axis { stroke: #607175; stroke-width: 2; }
    .xbar { stroke: #087b78; stroke-width: 7; }
    .hbar { stroke: #8f6500; stroke-width: 7; }
    .ybar { stroke: #8f6500; stroke-width: 7; }
    .dotx { fill: #087b78; }
    .doth { fill: #8f6500; }
    .doty { fill: #8f6500; }
    .window { fill: #f4c965; fill-opacity: .16; stroke: #8f6500; stroke-width: 2; stroke-dasharray: 7 6; }
    .calc { fill: #edf3f0; stroke: #68a8a5; stroke-width: 1.5; rx: 10; }
    .label { font-size: 20px; font-weight: 700; }
    .small { font-size: 16px; }
    .tiny { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f5f1e9; }
      .axis { stroke: #7f9291; }
      .xbar { stroke: #69eee3; }
      .hbar, .ybar { stroke: #f4c965; }
      .dotx { fill: #69eee3; }
      .doth, .doty { fill: #f4c965; }
      .window { fill: #f4c965; stroke: #f4c965; }
      .calc { fill: #11252b; stroke: #3f8582; }
    }
  </style>
  <text class="label" x="35" y="36">1. 输入 x[m]：固定不动</text>
  <line class="axis" x1="92" y1="128" x2="990" y2="128"/>
  <g aria-label="输入序列柱状图">
    <line class="xbar" x1="250" y1="128" x2="250" y2="70"/><circle class="dotx" cx="250" cy="70" r="7"/>
    <line class="xbar" x1="350" y1="128" x2="350" y2="42"/><circle class="dotx" cx="350" cy="42" r="7"/>
    <line class="xbar" x1="450" y1="128" x2="450" y2="84"/><circle class="dotx" cx="450" cy="84" r="7"/>
    <line class="xbar" x1="550" y1="128" x2="550" y2="100"/><circle class="dotx" cx="550" cy="100" r="7"/>
    <line class="xbar" x1="650" y1="128" x2="650" y2="62"/><circle class="dotx" cx="650" cy="62" r="7"/>
  </g>
  <text class="label" x="35" y="195">2. 滤波器 h[n-m]：翻转后滑动</text>
  <line class="axis" x1="92" y1="296" x2="990" y2="296"/>
  <g id="moving-kernel">
    <rect class="window" x="105" y="214" width="300" height="112" rx="8"/>
    <line class="hbar" x1="155" y1="296" x2="155" y2="246"/><circle class="doth" cx="155" cy="246" r="7"/>
    <line class="hbar" x1="255" y1="296" x2="255" y2="226"/><circle class="doth" cx="255" cy="226" r="7"/>
    <line class="hbar" x1="355" y1="296" x2="355" y2="262"/><circle class="doth" cx="355" cy="262" r="7"/>
    <text class="tiny" x="178" y="346">当前窗口内：相乘后累加</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;100 0;200 0;300 0;400 0;500 0;0 0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <rect class="calc" x="720" y="210" width="330" height="92"/>
  <text class="small" x="742" y="244">每移动一格：</text>
  <text class="small" x="742" y="272">重叠样本 × 滤波器权重，再求和</text>
  <text class="small" x="742" y="298">得到当前输出 y[n]</text>
  <text class="label" x="35" y="390">3. 输出 y[n]：卷积结果逐点形成</text>
  <line class="axis" x1="92" y1="475" x2="990" y2="475"/>
  <g aria-label="卷积输出序列柱状图">
    <line class="ybar" x1="250" y1="475" x2="250" y2="432"/><circle class="doty" cx="250" cy="432" r="7"/>
    <line class="ybar" x1="350" y1="475" x2="350" y2="405"/><circle class="doty" cx="350" cy="405" r="7"/>
    <line class="ybar" x1="450" y1="475" x2="450" y2="390"/><circle class="doty" cx="450" cy="390" r="7"/>
    <line class="ybar" x1="550" y1="475" x2="550" y2="406"/><circle class="doty" cx="550" cy="406" r="7"/>
    <line class="ybar" x1="650" y1="475" x2="650" y2="404"/><circle class="doty" cx="650" cy="404" r="7"/>
    <line class="ybar" x1="750" y1="475" x2="750" y2="435"/><circle class="doty" cx="750" cy="435" r="7"/>
  </g>
  <circle class="doty" r="11" cx="250" cy="432" opacity=".55">
    <animate attributeName="cx" values="250;350;450;550;650;750;250" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="432;405;390;406;404;435;432" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="640" y="494">低通例子中，输出比输入更平滑；</text>
  <text class="small" x="640" y="512">换 h[n] 就得到高通或带通效果。</text>
</svg>
